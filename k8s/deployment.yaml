apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-bookstore
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: online-bookstore
  template:
    metadata:
      labels:
        app: online-bookstore
    spec:
      containers:
        - name: bookstore
          image: 24mis0129/online-bookstore:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10